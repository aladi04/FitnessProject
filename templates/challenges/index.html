{% extends 'base.html' %}

{% block title %}Challenges - FitMate{% endblock %}

{% block content %}
<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h1 class="h3 mb-0">Challenges</h1>
      <p class="muted">Join community challenges and track your streaks.</p>
    </div>
    <div>
      <a class="btn btn-fitmate" href="#">Find Challenges</a>
    </div>
  </div>

  <div class="row g-4">
    <div class="col-md-4">
      <div class="card h-100">
        <div class="card-body">
          <h5 class="card-title">30-Day Steps</h5>
          <p class="muted">A daily walking challenge to boost activity.</p>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
