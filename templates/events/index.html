{% extends 'base.html' %}

{% block title %}Events - FitMate{% endblock %}

{% block content %}
<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h1 class="h3 mb-0">Events</h1>
      <p class="muted">Upcoming community and FitMate events.</p>
    </div>
    <div>
      <a class="btn btn-fitmate" href="#">Create Event</a>
    </div>
  </div>

  <div class="row g-4">
    <div class="col-md-6">
      <div class="card form-card">
        <h5 class="mb-2">Next Event</h5>
        <p class="muted">No upcoming events.</p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
