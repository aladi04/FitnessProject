{% extends 'base.html' %}

{% block title %}Login - FitMate{% endblock %}

{% block content %}
<div class="container py-4" style="max-width:420px;">
  <div class="card form-card shadow-sm">
    <div class="card-body">
      <h3 class="mb-3">Welcome back</h3>
      <p class="text-muted">Sign in to continue to FitMate.</p>
      <form method="post" class="mt-3">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn btn-fitmate w-100" type="submit">Login</button>
      </form>
      <div class="mt-3 text-center muted">Don't have an account? <a href="{% url 'signup' %}">Sign up</a></div>
    </div>
  </div>
</div>
{% endblock %}
