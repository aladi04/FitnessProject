{% extends "base.html" %}
{% load static %}

{% block extra_css %}
<link href="{% static 'css/community.css' %}" rel="stylesheet">
{% endblock %}

{% block content %}
<div class="container py-5 community-container">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card form-card shadow-sm">
                <div class="card-header">
                    <h4 class="mb-0">Edit Comment</h4>
                </div>
                <div class="card-body">
                    <form method="POST">
                        {% csrf_token %}
                        <div class="mb-3">
                            <textarea name="content" rows="4" class="form-control" required>{{ comment.content }}</textarea>
                        </div>
                        <div class="d-flex justify-content-end gap-2">
                            <a href="{% url 'post_details' comment.post.id %}" class="btn btn-outline-secondary">Cancel</a>
                            <button type="submit" class="btn btn-primary">Update Comment</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
