{% extends 'base.html' %}

{% block title %}Community - FitMate{% endblock %}

{% block content %}
<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h1 class="h3 mb-0">Community</h1>
      <p class="muted">Connect with peers and share progress.</p>
    </div>
    <div>
      <a class="btn btn-fitmate" href="#">New Post</a>
    </div>
  </div>

  <div class="row g-4">
    <div class="col-md-8">
      <div class="card form-card">
        <h5>Recent posts</h5>
        <p class="muted">No posts yet.</p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
