{% extends "base.html" %}
{% load static %}
{% block extra_css %}
<link href="{% static 'css/community.css' %}" rel="stylesheet">
{% endblock %}
{% block content %}
<div class="container" style="max-width: 700px;">
    <h2 class="fw-bold mb-4 text-center">Create Post</h2>
    <form method="POST" enctype="multipart/form-data" class="card p-4 shadow-sm form-card">
        {% csrf_token %}
        <div class="mb-3">
            <label class="form-label">Title</label>
            <input type="text" name="title" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Category</label>
            <select name="category" class="form-select">
                {% for key, label in categories %}
                    <option value="{{ key }}">{{ label }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">Content</label>
            <textarea name="content" rows="5" class="form-control" required></textarea>
        </div>
        <div class="mb-3">
            <label class="form-label">Image (optional)</label>
            <input type="file" name="image" class="form-control">
        </div>
        <div class="d-flex justify-content-between">
            <a href="{% url 'community' %}" class="btn btn-secondary">Cancel</a>
            <button type="submit" class="btn btn-success">Post</button>
        </div>
    </form>
</div>
{% endblock %}
