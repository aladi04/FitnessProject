{% extends 'base.html' %}

{% block title %}Nutrition - FitMate{% endblock %}

{% block content %}
<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h1 class="h3 mb-0">Nutrition</h1>
      <p class="muted">Meal plans and calorie tracking.</p>
    </div>
    <div>
      <a class="btn btn-fitmate" href="#">Create Plan</a>
    </div>
  </div>

  <div class="row g-4">
    <div class="col-md-6">
      <div class="card form-card">
        <h5 class="mb-2">Today's Meals</h5>
        <p class="muted">Breakfast, Lunch, Dinner.</p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
