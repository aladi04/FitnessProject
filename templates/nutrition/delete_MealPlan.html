{% extends 'base.html' %}
{% block title %}Delete Meal Plan - FitMate{% endblock %}

{% block content %}
<div class="container py-5">

    <div class="card dashboard-card shadow-sm rounded-4 p-5 text-center hover-shadow">
        <h2 class="text-danger mb-3">Delete Meal Plan</h2>
        <p class="mb-4">
            Are you sure you want to delete the meal plan for
            <span class="text-fitmate fw-bold">{{ mealplan.day }}</span>?
        </p>

        <form method="post">
            {% csrf_token %}

            <button type="submit" class="btn btn-fitmate me-2">
                <i class="fas fa-trash-alt me-2"></i> Yes, Delete
            </button>

            <a href="{% url 'list_mealplans' %}" class="btn ghost">
                <i class="fas fa-arrow-left me-2"></i> Cancel
            </a>
        </form>
    </div>

</div>
{% endblock %}
