{% extends 'base.html' %}

{% block title %}Sign up - FitMate{% endblock %}

{% block content %}
<div class="container py-4" style="max-width:480px;">
  <div class="card form-card shadow-sm">
    <div class="card-body">
      <h3 class="mb-3">Create your account</h3>
      <p class="text-muted">Join FitMate and track your progress.</p>
      <form method="post" class="mt-3">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn btn-fitmate w-100" type="submit">Create account</button>
      </form>
      <div class="mt-3 text-center muted">Already have an account? <a href="{% url 'login' %}">Log in</a></div>
    </div>
  </div>
</div>
{% endblock %}
